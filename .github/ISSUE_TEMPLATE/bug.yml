name: "🐛 Bug Report"
description: Report a bug or unexpected behavior so it can be triaged and fixed.
title: "[Bug]: "
labels:
  - bug
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit
        
                **Please [search existing issues](../../issues) first to make sure this bug has not already been reported.** If you find a matching issue, add a comment or a 👍 reaction there instead of opening a new one.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this happen? Also set the "Environment" field on the issue sidebar if you have permission to.
      options:
        - Production
        - Staging
        - Development
        - Local
        - Other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug? Also set the "Severity" field on the issue sidebar if you have permission to.
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module / Component
      description: Which part of the system is affected? Also set the "Module" field on the issue sidebar if you have permission to.
      options:
        - Authentication
        - Broadcast
        - WhatsApp
        - Ecommerce
        - Catalog
        - Inventory
        - Payments
        - Worker
        - API
        - Frontend
        - Admin
        - Infrastructure
        - Database
        - Other
    validations:
      required: false
  - type: input
    id: target-release
    attributes:
      label: Target release (optional)
      description: If known, which release/version should this be fixed in? Also set the "Target Release" field on the issue sidebar if you have permission to.
      placeholder: e.g. v2.4.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: If applicable, add screenshots, error messages, or log output. You can drag and drop files into this box.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help us understand or fix this bug.
    validations:
      required: false
