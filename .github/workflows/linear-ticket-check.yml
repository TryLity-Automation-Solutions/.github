name: Linear Ticket Check

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment if Linear ticket is missing
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- linear-ticket-check -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Read the latest body, not the one from the event payload.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.user.type === "Bot") return;

            const hasTicket = /https?:\/\/linear\.app\/[^\s)]+\/issue\/[A-Za-z0-9]+-\d+/.test(pr.body || "");

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (hasTicket) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                core.info("Linear ticket added, reminder comment removed.");
              }
              return;
            }

            if (existing) {
              core.info("Linear ticket missing, reminder already posted.");
              return;
            }

            const body = [
              marker,
              `@${pr.user.login} Please create the PR Description on Linear.`,
              "",
              "[**Create Linear Ticket →**](https://linear.app/trylity-tech-team/team/TRY/new?template=7b0a3d35-d6de-43a7-878c-980557a5ffa5)",
              "",
              "Then add the Linear Ticket URL to this PR.",
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info("Linear ticket missing, reminder posted.");
